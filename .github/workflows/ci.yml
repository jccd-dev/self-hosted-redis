name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          shellcheck --version
          docker compose version
      - name: Test suite
        # Redis takes ownership of the bind-mounted secrets, so operator scripts run as root, as documented.
        run: |
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo --preserve-env=PATH ./tests/run.sh
      - name: Package release
        run: |
          scripts/package-release.sh "$RUNNER_TEMP/dist"
          (cd "$RUNNER_TEMP/dist" && sha256sum -c self-hosted-redis.tar.gz.sha256)
