name: self-hosted-redis

services:
  redis:
    image: redis:8.8.0-alpine3.23
    command:
      - sh
      - -c
      # Re-enter the image entrypoint so it still drops Redis to its own user.
      - exec /usr/local/bin/docker-entrypoint.sh redis-server /usr/local/etc/redis/redis.conf --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy "$$REDIS_MAXMEMORY_POLICY"
    environment:
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-noeviction}
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./secrets/production:/run/redis
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/redis/health-password)" redis-cli --user health --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      shared-services:
        aliases:
          - redis

  restic:
    image: restic/restic:0.19.0
    profiles: ["tools"]
    entrypoint: ["restic"]
    env_file:
      - path: ${RESTIC_ENV_FILE:-./secrets/production/backup.env}
        required: false
    environment:
      RESTIC_PASSWORD_FILE: /run/secrets/restic-password
    volumes:
      - redis-data:/data:ro
      - restore-staging:/restore
      - ./secrets/production:/run/secrets:ro
      - local-restic:/local-backup
    networks:
      - shared-services

  redis-tools:
    image: redis:8.8.0-alpine3.23
    profiles: ["tools"]
    entrypoint: ["sh"]
    volumes:
      - redis-data:/data
      - restore-staging:/restore

volumes:
  redis-data:
    name: self-hosted-redis-data
  restore-staging:
    name: self-hosted-redis-restore-staging
  local-restic:
    name: self-hosted-redis-local-restic

networks:
  shared-services:
    name: shared-services
    external: true
